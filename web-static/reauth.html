<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obnovení profilu | Houbám Zdar</title>
    <meta name="description" content="Obnovení profilu po změnách ve správě účtu.">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="application-name" content="Houbám Zdar">
    <meta name="apple-mobile-web-app-title" content="Houbám Zdar">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#274d38">
    <link rel="stylesheet" href="styles/base.css">
</head>
<body data-page="reauth" class="page-shell page-reauth">
    <header class="site-header">
        <a href="/info.html" class="brand-link" aria-label="Houbám Zdar">
            <img src="/logo.png" alt="Logo Houbám Zdar" class="brand-mark">
            <div class="brand-copy">
                <span class="brand-eyebrow">Aktualizace účtu</span>
                <strong>Houbám Zdar</strong>
            </div>
        </a>
    </header>

    <main class="content-main content-main-narrow">
        <section class="reauth-card card">
            <p class="section-label">Synchronizace profilu</p>
            <h1>Změny jsou připravené</h1>
            <p>
                Vaše údaje ve správě účtu byly upraveny. Pro načtení nových dat do Houbám Zdar
                se prosím znovu přihlaste.
            </p>
            <button id="reauth-btn" class="btn btn-primary btn-large">Načíst aktualizovaný profil</button>
            <p id="reauth-status" class="status-message" aria-live="polite"></p>
        </section>
    </main>

    <script src="pwa.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
