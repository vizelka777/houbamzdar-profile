<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zpracování fotek | Houbám Zdar</title>
    <meta name="description" content="Lokální zpracování fotek hub s uložením do IndexedDB a přípravou pro pozdější nahrání.">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="application-name" content="Houbám Zdar">
    <meta name="apple-mobile-web-app-title" content="Houbám Zdar">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#274d38">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/page-capture.css">
</head>
<body data-page="capture" class="page-shell page-profile">
    <header class="site-header">
        <a href="/info.html" class="brand-link" aria-label="Houbám Zdar">
            <img src="/logo.png" alt="Logo Houbám Zdar" class="brand-mark">
            <div class="brand-copy">
                <span class="brand-eyebrow">Terén</span>
                <strong>Houbám Zdar</strong>
            </div>
        </a>
        <div id="auth-buttons" class="header-actions"></div>
    </header>

    <main class="content-main content-main-narrow">
        <div class="capture-overview">
            <p class="muted-copy capture-overview-total">Uloženo v telefonu: <strong id="capture-total">0</strong></p>
            <p id="capture-status" class="status-message capture-overview-status" aria-live="polite"></p>
            <div id="capture-gps-status" class="capture-gps-status" aria-live="polite" hidden></div>
            <div class="capture-gps-actions">
                <button id="capture-refresh-gps" type="button" class="btn btn-secondary">Zkusit GPS znovu</button>
            </div>
        </div>

        <section class="capture-launcher" aria-labelledby="capture-launch-title">
            <button id="capture-open-camera" type="button" class="capture-open-camera-button" disabled aria-describedby="capture-open-camera-state">
                <span class="capture-open-camera-glyph" aria-hidden="true">📷</span>
                <span id="capture-launch-title" class="capture-open-camera-label">Otevřít kameru</span>
                <span id="capture-open-camera-state" class="capture-open-camera-state">Čekám na GPS do 100 m</span>
            </button>
            <input id="capture-camera-input" type="file" accept="image/*" capture="environment" multiple class="sr-only">
        </section>

        <div id="capture-grid" class="capture-grid"></div>

        <div class="capture-footer-row">
            <a id="capture-footer-link" href="/server-storage.html" class="btn btn-secondary">Přejít k nahraným fotkám</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
    <script src="pwa.js" defer></script>
    <script src="app.js" defer></script>
    <script src="capture.js" defer></script>
</body>
</html>
