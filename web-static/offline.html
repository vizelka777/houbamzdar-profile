<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline | Houbám Zdar</title>
  <meta name="theme-color" content="#274d38">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe2;
      --card: rgba(255, 251, 244, 0.92);
      --text: #193122;
      --muted: #58705f;
      --accent: #274d38;
      --accent-soft: #dfe9e2;
      --border: rgba(39, 77, 56, 0.14);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(113, 161, 116, 0.18), transparent 42%),
        linear-gradient(180deg, #f8f4eb 0%, var(--bg) 100%);
      color: var(--text);
    }

    main {
      width: min(100%, 560px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 24px 60px rgba(25, 49, 34, 0.12);
    }

    img {
      display: block;
      width: 88px;
      height: 88px;
      margin-bottom: 20px;
      border-radius: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 2.7rem);
      line-height: 1.05;
    }

    p {
      margin: 0 0 14px;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .secondary {
      background: var(--accent-soft);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <img src="/icon-app-192.png" alt="Houbám Zdar">
    <h1>Jste offline</h1>
    <p>Aplikace je nainstalovaná a část obsahu zůstává dostupná i bez připojení, ale pro načtení nových příspěvků, map a profilu je potřeba internet.</p>
    <p>Zkuste obnovit stránku po připojení, nebo přejděte na už uloženou část webu.</p>
    <div class="actions">
      <a class="primary" href="/">Zkusit znovu</a>
      <a class="secondary" href="/info.html">O aplikaci</a>
    </div>
  </main>
</body>
</html>
