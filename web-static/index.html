<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novinky | Houbám Zdar</title>
    <meta name="description" content="Co se děje nového v aplikaci Houbám Zdar.">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="canonical" href="https://houbamzdar.cz/">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/page-explore.css">
    <link rel="stylesheet" href="styles/page-news.css">
    <link rel="stylesheet" href="styles/page-feed.css">
    <link rel="stylesheet" href="styles/page-gallery.css">
    <link rel="stylesheet" href="styles/page-map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="vendor/leaflet-markercluster/MarkerCluster.css">
</head>
<body data-page="news" class="page-shell">
    <header class="site-header">
        <a href="/info.html" class="brand-link" aria-label="Houbám Zdar">
            <img src="/logo.png" alt="Logo Houbám Zdar" class="brand-mark">
            <div class="brand-copy">
                <span class="brand-eyebrow">Co se děje</span>
                <strong>Novinky</strong>
            </div>
        </a>
        <div id="auth-buttons" class="header-actions"></div>
    </header>

    <main class="content-main content-main-narrow">
        <section class="cta-card card section-spaced news-section-card">
            <div class="news-section-head">
                <p class="section-label">Co se děje</p>
                <h2>Nejnovější publikace</h2>
            </div>
            <div id="home-latest-post" class="feed-list">
                <p class="muted-copy">Načítám...</p>
            </div>
            <div class="action-row">
                <a href="/feed.html" class="btn btn-secondary">Další publikace</a>
            </div>
        </section>

        <section class="cta-card card section-spaced news-section-card">
            <div class="news-section-head">
                <p class="section-label">Co se děje</p>
                <h2>Nejnovější fotografie</h2>
            </div>
            <div id="home-latest-photos" class="gallery-grid">
                <p class="muted-copy">Načítám...</p>
            </div>
            <div class="action-row">
                <a href="/gallery.html" class="btn btn-secondary">Další fotky</a>
            </div>
        </section>

        <section class="cta-card card section-spaced news-section-card">
            <div class="news-section-head">
                <p class="section-label">Komunita</p>
                <h2>Noví houbaři</h2>
            </div>
            <div id="home-latest-users">
                <p class="muted-copy">Načítám...</p>
            </div>
            <div class="action-row">
                <a href="/users.html" class="btn btn-secondary">Další houbaři</a>
            </div>
        </section>
    </main>

    <div id="news-species-modal" class="capture-species-modal" hidden aria-hidden="true">
        <div class="capture-species-modal-backdrop" data-close-news-species-modal></div>
        <div class="capture-species-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="news-species-title">
            <div class="capture-species-modal-head">
                <div>
                    <p class="section-label">Rozpoznané druhy</p>
                    <h2 id="news-species-title">Houby na fotografii</h2>
                </div>
                <button id="news-species-close" type="button" class="capture-species-modal-close" aria-label="Zavřít okno s druhy">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <p id="news-species-meta" class="capture-species-meta"></p>
            <div id="news-species-body"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="vendor/leaflet-markercluster/leaflet.markercluster.js"></script>
    <script src="map-clusters.js"></script>
    <script src="app.js" defer></script>
    <script src="feed.js" defer></script>
    <script src="news.js" defer></script>
</body>
</html>
