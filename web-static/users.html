<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Houbaři | Houbám Zdar</title>
    <meta name="description" content="Katalog houbařů aplikace Houbám Zdar.">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/page-explore.css">
    <link rel="stylesheet" href="styles/page-profile.css">
</head>
<body data-page="users" class="page-shell page-profile">
    <header class="site-header">
        <a href="/info.html" class="brand-link" aria-label="Houbám Zdar">
            <img src="/logo.png" alt="Logo Houbám Zdar" class="brand-mark">
            <div class="brand-copy">
                <span class="brand-eyebrow">Komunita</span>
                <strong>Houbám Zdar</strong>
            </div>
        </a>
        <div id="auth-buttons" class="header-actions"></div>
    </header>

    <main class="content-main content-main-narrow">
        <div class="users-page-stack">
            <section class="page-intro card public-profile-intro">
                <p class="section-label">Komunita</p>
                <h1 class="page-title">Houbaři</h1>
                <p id="users-summary" class="muted-copy">Načítám houbaře...</p>
            </section>

            <details class="accordion card">
                <summary class="accordion-summary">
                    <p class="accordion-title">Vyhledávání a řazení</p>
                </summary>
                <div class="accordion-body">
                    <form id="users-filter-form" class="public-capture-filter-form users-filter-form">
                        <div class="public-capture-filter-grid">
                            <label class="public-capture-filter-field">
                                <span>Hledat podle jména</span>
                                <input id="users-filter-query" type="search" placeholder="Zadejte jméno houbaře">
                            </label>
                            <label class="public-capture-filter-field">
                                <span>Seřadit podle</span>
                                <div class="select-wrapper">
                                    <select id="users-filter-sort">
                                        <option value="popularity">Nejoblíbenější (sledující)</option>
                                        <option value="posts">Nejvíce publikací</option>
                                        <option value="captures">Nejvíce fotografií</option>
                                        <option value="comments">Nejvíce komentářů</option>
                                    </select>
                                </div>
                            </label>
                        </div>
                        <div class="action-row users-filter-actions">
                            <button type="submit" class="btn btn-primary">Hledat</button>
                            <button id="users-filter-reset" type="button" class="btn btn-secondary">Vymazat</button>
                        </div>
                    </form>
                </div>
            </details>

            <section class="card">
                <div id="users-list" class="users-list"></div>
                <div id="users-load-more" class="load-more-row" hidden>
                    <button id="users-load-more-btn" type="button" class="btn btn-secondary">Načíst další houbaře</button>
                </div>
            </section>
        </div>
    </main>

    <script src="app.js" defer></script>
    <script src="users.js" defer></script>
</body>
</html>
